---
# Desired state of the MyGarage server. Secrets live in vault.yml
# (Ansible Vault); runtime state (active slot, release SHA) lives on the
# server in /var/lib/mygarage-deploy and is never managed from here.

timezone: UTC

# --- access -----------------------------------------------------------------
admin_user: ops
admin_ssh_public_keys:
  - "{{ lookup('file', playbook_dir + '/../ssh_keys/admin.pub') }}"
  - "{{ lookup('file', playbook_dir + '/../ssh_keys/ci-ansible.pub') }}"

deploy_user: deploy
deploy_ssh_public_key: "{{ lookup('file', playbook_dir + '/../ssh_keys/deploy.pub') }}"

ssh_port: 22
# Temporary: root and password logins stay enabled until manual access is no
# longer needed; set both to false to allow keys only.
ssh_permit_root_login: true
ssh_password_authentication: true

# --- system -----------------------------------------------------------------
base_upgrade_packages: false
base_swap_enabled: true
base_swap_size_mb: 1024
base_swappiness: 10
journald_max_use: 200M
firewall_enabled: true

# --- proxy ------------------------------------------------------------------
# The domain comes from the GitHub secret MYGARAGE_DOMAIN (masked in the
# public Actions logs), like the server address. Empty serves plain HTTP on
# the IP address; once set, a Let's Encrypt certificate is issued, so the
# DNS A record must point at the server first.
mygarage_domain: "{{ lookup('ansible.builtin.env', 'MYGARAGE_DOMAIN') }}"
mygarage_tls_enabled: true
proxy_check_port: 8080
proxy_client_max_body_size: 20m
htpasswd_users: "{{ vault_htpasswd_users }}"

# --- static site ------------------------------------------------------------
# Domain from the GitHub secret SITE_DOMAIN; empty disables the site. The
# website repository publishes over SSH (site-receive.sh): production at
# https://<domain> (http:// and www.<domain> redirect there), pull requests
# at https://test.<domain> behind its own basic auth. site/ of this repository is
# served until the first upload. TLS follows mygarage_tls_enabled.
site_domain: "{{ lookup('ansible.builtin.env', 'SITE_DOMAIN') }}"
# Needs the DNS record test.<domain> before it is enabled (certificate).
site_test_enabled: true
site_test_domain: test.{{ site_domain }}
# Basic auth of test.<domain>: its own logins (scripts/vault.sh), not the
# application's.
site_test_auth: true
site_test_htpasswd_users: "{{ vault_site_test_htpasswd_users | default([]) }}"
site_root: /var/www/site
# / redirects to /<lang>/ by Accept-Language weights, among the language
# directories of the served release; this one when none of them matches.
site_default_lang: en
site_bin_dir: /opt/site/bin
site_user: site
# One key per environment of the website repository; a missing file only
# disables uploads to that environment.
site_deploy_ssh_public_keys:
  production: "{{ lookup('file', playbook_dir + '/../ssh_keys/site-production.pub', errors='ignore') }}"
  test: "{{ lookup('file', playbook_dir + '/../ssh_keys/site-test.pub', errors='ignore') }}"
site_releases_keep: 3
site_max_upload_mb: 50
site_max_unpacked_mb: 200

# --- application ------------------------------------------------------------
mygarage_slots:
  blue: 8081
  green: 8082
mygarage_data_dir: /var/lib/mygarage
mygarage_app_dir: /opt/mygarage
deploy_state_dir: /var/lib/mygarage-deploy
openresty_bin: /usr/local/openresty/bin/openresty
mygarage_memory_high: 200M
mygarage_memory_max: 280M
mygarage_gomemlimit: 160MiB

deploy_min_mem_available_mb: 120
deploy_ready_timeout: 60
deploy_drain_seconds: 10
deploy_releases_keep: 5

# --- backup -----------------------------------------------------------------
backup_dir: /var/backups/mygarage
backup_on_calendar: "*-*-* 03:30:00"
backup_keep_days: 14
backup_min_free_mb: 1024
# POST /backup/create on the active slot: the application uploads the
# snapshot to Google Drive according to its own settings.
backup_trigger_app: true

# --- monitoring -------------------------------------------------------------
monitor_on_calendar: "*:0/5"
monitor_disk_max_percent: 85
monitor_swap_max_percent: 50
monitor_mem_min_available_mb: 80
monitor_tls_min_days: 14
monitor_alert_url: "{{ vault_monitor_alert_url | default('') }}"
