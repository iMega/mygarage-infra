---
# Local test bench: AlmaLinux 9 container with systemd (see test/run.sh).
# group_vars/all/main.yml links to the production one; the encrypted
# vault.yml is left out, its variables are defined here.
all:
  children:
    mygarage:
      hosts:
        mygarage-test:
          ansible_connection: community.docker.docker
          ansible_host: mygarage-test
          ansible_user: ops
          ansible_docker_extra_args: ""
          # Containers cannot manage swap.
          base_swap_enabled: false
          bootstrap_reboot: false
          admin_ssh_public_keys:
            - "{{ lookup('file', playbook_dir + '/../test/.state/admin.pub') }}"
          deploy_ssh_public_key: "{{ lookup('file', playbook_dir + '/../test/.state/deploy.pub') }}"
          # garage / garage
          vault_htpasswd_users:
            - name: garage
              hash: "{{ lookup('file', playbook_dir + '/../test/.state/htpasswd-hash') }}"
          # test / testtest
          vault_site_test_htpasswd_users:
            - name: test
              hash: "{{ lookup('file', playbook_dir + '/../test/.state/site-test-htpasswd-hash') }}"
          vault_monitor_alert_url: ""
          # Static sites by Host header (site.test, test.site.test), no TLS.
          site_domain: site.test
          site_test_enabled: true
          mygarage_tls_enabled: false
          site_deploy_ssh_public_keys:
            production: "{{ lookup('file', playbook_dir + '/../test/.state/site-production.pub') }}"
            test: "{{ lookup('file', playbook_dir + '/../test/.state/site-test.pub') }}"
