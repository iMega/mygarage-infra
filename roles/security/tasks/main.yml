---
- name: Assert admin keys are configured
  ansible.builtin.assert:
    that: admin_ssh_public_keys | select | list | length > 0
    fail_msg: "admin_ssh_public_keys is empty: refusing to disable password login"

- name: Keep admin SSH keys in sync
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    key: "{{ admin_ssh_public_keys | join('\n') }}"
    exclusive: true

- name: Install security packages
  ansible.builtin.dnf:
    name:
      - openssh-server
      - fail2ban-server
      - fail2ban-firewalld
      - firewalld
    state: present

- name: Generate missing SSH host keys
  ansible.builtin.command:
    cmd: ssh-keygen -A
    creates: /etc/ssh/ssh_host_ed25519_key

- name: Harden sshd
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

- name: Enable sshd
  ansible.builtin.systemd_service:
    name: sshd
    enabled: true
    state: started

- name: Configure firewall
  ansible.builtin.import_tasks: firewall.yml
  when: firewall_enabled | bool

- name: Configure fail2ban
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Enable fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    enabled: true
    state: started
