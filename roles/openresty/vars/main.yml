---
openresty_conf_dir: /usr/local/openresty/nginx/conf
openresty_cert_dir: /etc/letsencrypt/live/{{ mygarage_domain }}
openresty_tls: "{{ (mygarage_tls_enabled | bool) and (mygarage_domain | length > 0) }}"
openresty_site_enabled: "{{ site_domain | length > 0 }}"
openresty_site_cert_dir: /etc/letsencrypt/live/{{ site_domain }}
openresty_site_tls: "{{ (mygarage_tls_enabled | bool) and openresty_site_enabled }}"

# Site configs this role templates; anything else in conf.d is removed.
# tls: HTTPS is wanted; cert: where certbot puts the certificate.
openresty_sites: >-
  {{
    [{'conf': 'mygarage.conf', 'tls': openresty_tls, 'cert': openresty_cert_dir}]
    + ([{'conf': 'site.conf', 'tls': openresty_site_tls, 'cert': openresty_site_cert_dir}]
       if openresty_site_enabled else [])
  }}

# One certificate per name; certbot stores it in /etc/letsencrypt/live/<name>.
openresty_certificates: >-
  {{
    ([{'name': mygarage_domain, 'domains': [mygarage_domain]}] if openresty_tls else [])
    + ([{'name': site_domain, 'domains': [site_domain, 'www.' + site_domain]}]
       if openresty_site_tls else [])
  }}
