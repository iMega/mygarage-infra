---
# site/ of this repository is the only source: files removed there are
# removed from the server too.
- name: Create site root
  ansible.builtin.file:
    path: "{{ site_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create site directories
  ansible.builtin.file:
    path: "{{ site_root }}/{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ query('community.general.filetree', playbook_dir + '/../site') | selectattr('state', 'eq', 'directory') }}"
  loop_control:
    label: "{{ item.path }}"

- name: Copy site files
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ site_root }}/{{ item.path }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ query('community.general.filetree', playbook_dir + '/../site') | selectattr('state', 'eq', 'file') }}"
  loop_control:
    label: "{{ item.path }}"

- name: Find published site files
  ansible.builtin.find:
    paths: "{{ site_root }}"
    recurse: true
    file_type: any
    hidden: true
  register: openresty_site_published

- name: Remove site files not in the repository
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ openresty_site_published.files | map(attribute='path')
       | reject('in', query('community.general.filetree', playbook_dir + '/../site')
                      | map(attribute='path') | map('regex_replace', '^', site_root + '/'))
       | sort | reverse }}
