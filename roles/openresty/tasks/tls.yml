---
- name: Apply pending proxy changes before the ACME challenge
  ansible.builtin.meta: flush_handlers

- name: Request certificates
  ansible.builtin.command:
    cmd: >-
      certbot certonly --webroot -w /var/www/letsencrypt
      --cert-name {{ item.name }} -d {{ item.domains | join(' -d ') }}
      --register-unsafely-without-email
      --agree-tos --non-interactive --keep-until-expiring
    creates: /etc/letsencrypt/live/{{ item.name }}/fullchain.pem
  loop: "{{ openresty_certificates }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create renewal hook directory
  ansible.builtin.file:
    path: /etc/letsencrypt/renewal-hooks/deploy
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Reload proxy after certificate renewal
  ansible.builtin.copy:
    dest: /etc/letsencrypt/renewal-hooks/deploy/reload-openresty.sh
    content: |
      #!/bin/sh
      # Managed by Ansible
      /usr/local/openresty/bin/openresty -t && systemctl reload openresty
    owner: root
    group: root
    mode: "0755"

- name: Enable certificate renewal
  ansible.builtin.systemd_service:
    name: certbot-renew.timer
    enabled: true
    state: started

- name: Enable HTTPS sites
  ansible.builtin.template:
    src: "{{ item.conf }}.j2"
    dest: "{{ openresty_conf_dir }}/conf.d/{{ item.conf }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ openresty_sites | selectattr('tls') }}"
  loop_control:
    label: "{{ item.conf }}"
  vars:
    openresty_tls_ready: true
  notify: Reload openresty
